<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accident Survival Prediction</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #6a11cb, #c3a6ff, #2575fc);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 320px;
            backdrop-filter: blur(10px);
        }
        h2 {
            text-align: center;
            color: #444;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        input[type="number"], select {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background-color: #f9f9f9;
            transition: border-color 0.3s ease;
        }
        input[type="number"]:focus, select:focus {
            border-color: #6a11cb;
            outline: none;
            background-color: #fff;
        }
        input[type="submit"] {
            background-color: #6a11cb;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }
        input[type="submit"]:hover {
            background-color: #2575fc;
        }
        .prediction {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            color: #444;
            font-weight: 500;
        }
        .prediction h3 {
            margin: 0;
            color: #6a11cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Accident Survival Prediction</h2>
        <form method="post">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label for="speed">Speed of Impact:</label>
            <input type="number" id="speed" name="speed" step="any" required>

            <label for="helmet">Helmet Used:</label>
            <select id="helmet" name="helmet">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>

            <label for="seatbelt">Seatbelt Used:</label>
            <select id="seatbelt" name="seatbelt">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>

            <input type="submit" value="Predict">
        </form>
        {% if prediction %}
            <div class="prediction">
                <h3>Prediction: {{ prediction }}</h3>
            </div>
        {% endif %}
    </div>
</body>
</html>
